name: daily-question-production
on:
  schedule:
    - cron: "0 3 * * *"        # every day 03:00 UTC (04:00 Algiers)
  workflow_dispatch:           # manual "Run workflow" button on GitHub
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install anthropic
      - run: python backend/tools/produce.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTHOR_MODEL: claude-sonnet-5
          AUDITOR_MODEL: claude-opus-5
          MAX_ITEMS: "25"
          MAX_BATCHES: "8"
          MAX_USD: "4"
      - name: commit stored lots
        run: |
          git config user.name "produce-bot"
          git config user.email "bot@certifizer"
          git add backend/tools/bank/
          git commit -m "production run $(date -u +%Y-%m-%d)" || echo "nothing new"
          git push
